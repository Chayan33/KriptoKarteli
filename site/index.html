
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kripto Kartel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background"></div>
    <div class="game-wrapper">

        <header>
            <div class="player-card">
                <img src="https://i.ibb.co/6gHT4m4/avatar-mafya.png" alt="Karakter" class="avatar-glow">
                <div class="level-info">
                    <h3>Seviye <span id="level">1</span></h3>
                    <div class="xp-bar"><div id="xp-fill"></div></div>
                </div>
            </div>
        </header>

        <main>
            <div class="stats">
                <h1><span id="puan">0</span> 💰</h1>
                <p>Puan</p>
            </div>
            <button id="click-btn" class="glow-button">👊 Tıkla ve Kazan</button>
        </main>

        <footer>
            <button class="nav-btn">🎁</button>
            <button class="nav-btn">🛒</button>
            <button class="nav-btn">🏆</button>
            <button class="nav-btn">⚙️</button>
        </footer>
    </div>

    <!-- POPUP BÖLÜMLERİ (BONUS, MARKET, SIRALAMA) HTML'e entegre edildiği için ayrı tutulacak -->
    <script src="script.js"></script>
</body>
</html>
